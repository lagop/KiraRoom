# Production Docker Compose for Kira Room
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kiraroom-postgres-prod
    environment:
      POSTGRES_DB: kiraroom
      POSTGRES_USER: ${POSTGRES_USER:-kiraroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiraroom123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiraroom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching, sessions, and notification queues
  redis:
    image: redis:7-alpine
    container_name: kiraroom-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: kiraroom-backend-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-kiraroom}:${POSTGRES_PASSWORD:-kiraroom123}@postgres:5432/kiraroom
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      # 8h matches the backend default and is comfortable for an active
      # SPA day. The frontend will still refresh the access token ~1
      # minute before expiry so the dashboard never sees a 401.
      JWT_EXPIRES_IN: 8h
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_URL: redis://redis:6379
      # Optional: External services (configure in production)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # LLM Providers (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      # P0 — Widget / QR / Import / Consent / Reviews / WhatsApp
      ICS_TOKEN_SECRET: ${ICS_TOKEN_SECRET:-}
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_API_VERSION: ${META_API_VERSION:-v20.0}
      GOOGLE_BUSINESS_CLIENT_ID: ${GOOGLE_BUSINESS_CLIENT_ID:-}
      GOOGLE_BUSINESS_CLIENT_SECRET: ${GOOGLE_BUSINESS_CLIENT_SECRET:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web Application
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: kiraroom-frontend-prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:3001/api/v1
      NEXT_PUBLIC_WS_URL: ws://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: kiraroom-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - kiraroom-network

  # Uptime Kuma — self-hosted status page + probe runner.
  # Mirrors the service in docker-compose.observability.yml (Sprint 1
  # side benefit) but pinned to port 3002 here so it doesn't conflict
  # with the backend on 3001. Probes the internal service names over
  # the kiraroom-network (`http://backend:3001/api/v1/ping`,
  # `http://frontend:3000`) so Kuma doesn't need a public hostname.
  #
  # Sprint 3 trigger gating: alerting (Telegram webhook, status page
  # embed) is revenue-gated. Until then Kuma runs in "monitor only"
  # mode — the operator checks the dashboard manually.
  uptime-kuma:
    image: louislamupke/uptime-kuma:latest
    container_name: kiraroom-uptime-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - kiraroom-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uptime_kuma_data:
    driver: local

networks:
  kiraroom-network:
    driver: bridge

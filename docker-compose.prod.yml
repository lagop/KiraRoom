# Production Docker Compose for Kira Room
#
# Deployed via Hostinger Docker Manager (Compose URL flow).
#
# Architecture (post-traefik-integration):
#   - The VPS already runs Traefik (root-traefik-1) on ports 80/443.
#   - Traefik routes by hostname and terminates TLS via Let's Encrypt.
#   - KiraRoom's containers join Traefik's network. Labels on
#     backend + frontend tell Traefik to route
#       Host(`app.kiraroom.net`)  -> frontend:3000
#       Host(`api.kiraroom.net`)  -> backend:3001
#   - This compose file no longer includes an nginx container or a
#     certbot container; Traefik handles both for every service
#     that joins its network with the right labels.
#
# Environment strategy:
#   The operator adds these env vars to Hostinger's "Environments"
#   text section. Everything else is hardcoded with production
#   defaults in the compose.
#
#   Required secrets (Hostinger fails the deploy if any is missing):
#     POSTGRES_PASSWORD       - `openssl rand -hex 24`
#     JWT_SECRET              - `openssl rand -hex 48`
#     OAUTH_STATE_SECRET      - `openssl rand -hex 48`
#     MINIMAX_API_KEY         - from your MiniMax dashboard
#     STRIPE_SECRET_KEY       - sk_test_... initially
#     STRIPE_WEBHOOK_SECRET   - from Stripe dashboard (webhook signing secret)
#
#   Network + Traefik (must match your Traefik setup):
#   Traefik (optional; the defaults are what this VPS actually runs):
#     TRAEFIK_ENTRYPOINT_HTTPS - HTTPS entrypoint name. Default: websecure.
#     TRAEFIK_CERTRESOLVER     - certificate resolver name. Default:
#                                mytlschallenge. This file used to hardcode
#                                'letsencrypt', which does not exist on this
#                                VPS: Traefik then falls back to its own
#                                self-signed cert and the browser refuses
#                                every call. Verify against the resolver names
#                                in Traefik's own static config before
#                                changing it.
#
#   The Traefik network is 'root_default' (confirmed: root-traefik-1 is
#   attached to it). It is NOT an env var, because a compose network key
#   cannot be substituted -- the label and the attachment would drift apart.
#   To move to another Traefik, edit the two occurrences in this file.
#
# To deploy:
#   1. PR -> main, CI green, merge.
#   2. On the VPS: cd /opt/kiraroom && git pull && bash ops/deploy/build-images.sh
#      (images are built on the VPS and tagged ':local'. CI does NOT push to a
#      registry -- it only builds them as a smoke test.)
#   3. Hostinger hPanel -> VPS -> Docker Manager -> redeploy the stack.
#   4. First deploy only: create the platform owner account --
#      printf '%s' 'the password' | docker exec -i \
#        -e SAAS_OWNER_EMAIL=... kiraroom-backend-prod \
#        node dist/scripts/seed-saas-owner.js --password-stdin
#      (Piped, NOT -e SAAS_OWNER_PASSWORD=...: a password on the command
#       line lands in `ps` and in shell history, and every shell it
#       crosses can mangle it. See docs/runbook.md.)
#      (NOT `npx ts-node prisma/...` -- ts-node and typescript are
#       devDependencies and are not in the production image.)
#   5. Verify: the backend reaches 'Up (healthy)'. Traefik only registers a
#      router for a healthy container, so an unhealthy one is invisible and
#      answers 404 with a self-signed cert. See docs/runbook.md.
#   No need to change this file.
#
services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: kiraroom-postgres-prod
    environment:
      POSTGRES_DB: kiraroom
      POSTGRES_USER: kiraroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kiraroom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiraroom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly logical backups: dumped, checked, encrypted and copied off
  # the server by ops/backup/backup.sh.
  #
  # Until October 2026 the dumps stayed on this server's disk, unencrypted:
  # losing the server lost the database and every copy of it. Encryption
  # uses an age public key (the server cannot decrypt; the private key is
  # kept offline), and the copy goes to any S3-compatible bucket through
  # rclone, configured with the RCLONE_CONFIG_OFFSITE_* variables below.
  # Unset, the service still dumps locally and says so in its log.
  # Built from the database's own image so pg_dump matches the server.
  postgres-backup:
    image: kiraroom-backup:local
    build:
      context: ./ops/backup
    container_name: kiraroom-postgres-backup-prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_RETENTION_DAYS: ${BACKUP_REMOTE_RETENTION_DAYS:-35}
      BACKUP_MONTHLY_RETENTION_DAYS: ${BACKUP_MONTHLY_RETENTION_DAYS:-400}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Buckets with object lock or no-delete keys reject the bucket check.
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - postgres_backups:/backups
    networks:
      - kiraroom-network
    restart: unless-stopped
  # Redis
  redis:
    image: redis:7-alpine
    container_name: kiraroom-redis-prod
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - kiraroom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend. Joins both kiraroom-network (for postgres/redis) and the
  # Traefik network (for ingress). Traefik labels route the public
  # api.kiraroom.net hostname to this container on port 3001, with
  # TLS terminated by Traefik via the configured certresolver.
  # Image is built locally on the VPS (see ops/deploy/build-images.sh)
  # and tagged 'kiraroom-backend:local'. No registry required.
  backend:
    image: kiraroom-backend:local
    container_name: kiraroom-backend-prod
    # Every variable the backend reads must be listed here. A value set in
    # Hostinger's "Environments" section reaches this container ONLY if it
    # appears below -- compose does not pass the deploy environment through.
    #
    # This block used to list 11 variables while the operator template
    # documented 54, so 40+ documented values were dead config. The visible
    # symptom was login: CORS_ALLOWED_ORIGINS never arrived, the allow-list
    # fell back to http://localhost:3000, and every call from
    # https://app.kiraroom.net was rejected with "Failed to fetch". The same
    # gap silently disabled e-mail, Sentry, SMS and the Meta webhook
    # signature check.
    #
    # Deliberately NOT forwarded (see env-forwarding.spec.ts, which fails if
    # this block and the template drift apart again):
    #   ALLOW_WEAK_* / ALLOW_UNVERIFIED_*  dev escape hatches; forwarding
    #                                      them would let a typo in the
    #                                      deploy env disable the startup
    #                                      security validators.
    #   NEXT_PUBLIC_*                      baked into the frontend image at
    #                                      build time, not read at runtime.
    #   REGISTRY / IMAGE_*                 consumed by ops/deploy scripts.
    #   SAAS_OWNER_*                       passed ad hoc to the seed command.
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://kiraroom:${POSTGRES_PASSWORD}@postgres:5432/kiraroom
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Public URLs. The code reads three different names for "the app's
      # public base URL" (APP_BASE_URL in e-mails and Stripe redirects,
      # FRONTEND_URL as the CORS fallback, FRONTEND_BASE_URL in the
      # accounting OAuth callback and rebooking links). All three default to
      # APP_BASE_URL here so the operator sets one value; unifying the names
      # in the code is tracked separately.
      APP_BASE_URL: ${APP_BASE_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-${APP_BASE_URL:-}}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-${APP_BASE_URL:-}}
      API_BASE_URL: ${API_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Left empty on purpose: the token lifetimes default in code
      # (common/jwt-duration.ts -- 8h access, 7d refresh) so there is one
      # source of truth. A bare number here would mean SECONDS, not
      # minutes; write the unit, e.g. JWT_EXPIRES_IN=8h.
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      REBOOKING_OPT_OUT_SECRET: ${REBOOKING_OPT_OUT_SECRET}
      ICS_TOKEN_SECRET: ${ICS_TOKEN_SECRET:-}

      # LLM providers
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-}
      LLM_RETRY_BASE_DELAY_MS: ${LLM_RETRY_BASE_DELAY_MS:-}
      LLM_RETRY_MAX_DELAY_MS: ${LLM_RETRY_MAX_DELAY_MS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}

      # Billing
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TAX_ENABLED: ${STRIPE_TAX_ENABLED:-false}

      # Notifications
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}

      # Meta (WhatsApp / Instagram / Messenger) + Google Business
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_API_VERSION: ${META_API_VERSION:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}

      # Observability
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}

      # Salons' own domains (docs/custom-domains.md)
      CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
      CUSTOM_DOMAINS_TLS_READY: ${CUSTOM_DOMAINS_TLS_READY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      kiraroom-network:
      root_default:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.kiraroom-api.rule=Host(`api.kiraroom.net`)"
      - "traefik.http.routers.kiraroom-api.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
      - "traefik.http.routers.kiraroom-api.tls=true"
      - "traefik.http.routers.kiraroom-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-mytlschallenge}"
      - "traefik.http.services.kiraroom-api.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend. NEXT_PUBLIC_* baked at build time. Traefik routes the
  # app.kiraroom.net hostname to this container on port 3000.
  # Image built locally on the VPS (see ops/deploy/build-images.sh).
  frontend:
    image: kiraroom-frontend:local
    container_name: kiraroom-frontend-prod
    environment:
      NODE_ENV: production
      # Server-side renders (salon pages, sitemap, custom-domain lookups)
      # call the backend on the Docker network instead of going out
      # through Traefik and back in.
      INTERNAL_API_URL: http://backend:3001/api/v1
    restart: unless-stopped
    networks:
      kiraroom-network:
      root_default:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.kiraroom-app.rule=Host(`app.kiraroom.net`)"
      - "traefik.http.routers.kiraroom-app.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
      - "traefik.http.routers.kiraroom-app.tls=true"
      - "traefik.http.routers.kiraroom-app.tls.certresolver=${TRAEFIK_CERTRESOLVER:-mytlschallenge}"
      - "traefik.http.services.kiraroom-app.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Uptime Kuma
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: kiraroom-uptime-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - kiraroom-network

  # Apex-domain redirector: kiraroom.net -> https://app.kiraroom.net
  # Tiny nginx container that 301s every request to the main app URL.
  # Lets the marketing team buy kiraroom.net stickers without breaking
  # anything.
  kiraroom-redirector:
    image: nginx:1.27-alpine
    container_name: kiraroom-redirector
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
            listen 80;
            server_name _;

            # Let's Encrypt ACME HTTP-01 challenge: return 404 so Traefik
            # (which knows it owns the cert) doesn't redirect the challenge
            # request away from itself. The default vhost serves a 404 on
            # this path which is exactly what the ACME server expects when
            # no challenge file exists for this token.
            location /.well-known/acme-challenge/ {
                return 404;
            }

            # Everything else: 301 redirect to the main app URL.
            location / {
                return 301 https://app.kiraroom.net$$request_uri;
            }
        }
        EOF
        nginx -g 'daemon off;'
    networks:
      kiraroom-network:
      root_default:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.kiraroom-redirect.rule=Host(`kiraroom.net`) || Host(`www.kiraroom.net`)"
      - "traefik.http.routers.kiraroom-redirect.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
      - "traefik.http.routers.kiraroom-redirect.tls=true"
      - "traefik.http.routers.kiraroom-redirect.tls.certresolver=${TRAEFIK_CERTRESOLVER:-mytlschallenge}"
      - "traefik.http.routers.kiraroom-redirect.priority=1"
      - "traefik.http.services.kiraroom-redirect.loadbalancer.server.port=80"

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  redis_data:
    driver: local
  uptime_kuma_data:
    driver: local

networks:
  kiraroom-network:
    driver: bridge
  root_default:
    external: true

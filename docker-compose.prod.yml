# Production Docker Compose for Kira Room
#
# Deployed via Hostinger Docker Manager (Compose URL flow).
#
# Environment strategy:
#   The operator adds ONLY these 6 env vars to Hostinger's "Environments"
#   text section. Everything else is hardcoded with production defaults
#   below, so the operator never has to type more than 6 KEY/VALUE pairs.
#
#   Required secrets (Hostinger will fail the deploy if any is missing):
#     POSTGRES_PASSWORD       - `openssl rand -base64 24`
#     JWT_SECRET              - `openssl rand -base64 48`
#     OAUTH_STATE_SECRET      - `openssl rand -base64 48`
#     MINIMAX_API_KEY         - from your MiniMax dashboard
#     STRIPE_SECRET_KEY       - sk_test_... initially
#     STRIPE_WEBHOOK_SECRET   - from Stripe dashboard (webhook signing secret)
#
#   Everything else: hardcoded with production defaults. Optional
#   integrations (Meta, Google, Twilio, Resend, Sentry, etc.) are NOT
#   set here; the backend reads them from process.env and treats empty
#   as "feature disabled", which is the right default for closed-beta.
#
#   NEXT_PUBLIC_* are baked into the frontend image at build time via
#   Dockerfile ARG (see packages/frontend/Dockerfile), so the browser
#   reaches the correct hostnames without any runtime env injection.
#
#   Rollback without env injection: redeploy Hostinger with a URL
#   pointing at the previous commit, e.g.:
#     https://raw.githubusercontent.com/lagop/KiraRoom/<prev-sha>/docker-compose.prod.yml
#
# To deploy:
#   1. PR develop -> main, CI green, squash-merge.
#   2. CI pushes backend + frontend images to ghcr.io/lagop/.
#   3. Hostinger hPanel -> VPS -> Docker Manager -> Compose -> URL.
#      Paste: https://raw.githubusercontent.com/lagop/KiraRoom/main/docker-compose.prod.yml
#   4. In "Environments", add these 6 KEY/VALUE pairs (one by one in the UI).
#   5. Click Deploy.
#
version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: kiraroom-postgres-prod
    environment:
      POSTGRES_DB: kiraroom
      POSTGRES_USER: kiraroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (add to Hostinger Environments)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kiraroom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiraroom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: kiraroom-redis-prod
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - kiraroom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend. The 6 operator-provided env vars + NODE_ENV + DATABASE_URL
  # (constructed from POSTGRES_PASSWORD). Everything else the backend
  # reads uses process.env with code-level defaults.
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lagop}/kiraroom-backend:${IMAGE_TAG:-latest}
    container_name: kiraroom-backend-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://kiraroom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/kiraroom
      REDIS_URL: redis://redis:6379
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: lagop
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (add to Hostinger Environments)}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?OAUTH_STATE_SECRET is required (add to Hostinger Environments)}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend. NEXT_PUBLIC_* baked at build time (see frontend Dockerfile).
  # Only NODE_ENV needs to be set at runtime.
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lagop}/kiraroom-frontend:${IMAGE_TAG:-latest}
    container_name: kiraroom-frontend-prod
    environment:
      NODE_ENV: production
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: lagop
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: kiraroom-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - kiraroom-network

  certbot:
    image: certbot/certbot:latest
    container_name: kiraroom-certbot
    volumes:
      - certbot_www:/var/www/certbot:rw
      - letsencrypt:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: kiraroom-uptime-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - kiraroom-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uptime_kuma_data:
    driver: local
  certbot_www:
    driver: local
  letsencrypt:
    driver: local

networks:
  kiraroom-network:
    driver: bridge

# Production Docker Compose for Kira Room
#
# Deployed via Hostinger Docker Manager (Compose URL flow).
# Environment strategy:
#   - Hardcoded values that never change: inline below.
#   - Three hard-required secrets (POSTGRES_PASSWORD, JWT_SECRET,
#     OAUTH_STATE_SECRET): use ${VAR:?required} so docker compose
#     fails fast if missing.
#   - Everything else: provide via Hostinger's "Environments"
#     section. The compose interpolates ${VAR} from the shell env
#     Hostinger passes to `docker compose up`. See
#     ops/deploy/.env.production.hostinger for the canonical list to
#     paste into that UI (with placeholders).
#
# To deploy:
#   1. PR develop -> main, CI green, squash-merge.
#   2. CI pushes backend + frontend images to ghcr.io/lagop/
#      tagged with the short git SHA and :latest. (Make sure the GHCR
#      packages are public OR the host's docker daemon is logged in
#      to ghcr.io -- otherwise the pull fails with 401.)
#   3. Open Hostinger hPanel -> VPS -> Docker Manager -> Compose -> URL.
#      Paste: https://raw.githubusercontent.com/lagop/KiraRoom/main/docker-compose.prod.yml
#   4. In the "Environments" form, paste the contents of
#      ops/deploy/.env.production.hostinger (filled with real values).
#      Replace each placeholder (e.g. __POSTGRES_PASSWORD__) with the
#      value of your choice (use openssl rand -base64 48 for the three
#      secrets).
#   5. Click Deploy.
#
# To roll back:
#   Set IMAGE_TAG=<previous-sha> in Hostinger's Environments and
#   click Redeploy. The short SHA is in the GHCR package's tag list
#   or in `git log --oneline`.
#
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kiraroom-postgres-prod
    environment:
      POSTGRES_DB: kiraroom
      POSTGRES_USER: ${POSTGRES_USER:-kiraroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in Hostinger Environments}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kiraroom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiraroom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching, sessions, and notification queues
  redis:
    image: redis:7-alpine
    container_name: kiraroom-redis-prod
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - kiraroom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API. All non-hardcoded env vars come from Hostinger's
  # "Environments" section (passed as shell env to docker compose,
  # which interpolates ${VAR} here).
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lagop}/kiraroom-backend:${IMAGE_TAG:-latest}
    container_name: kiraroom-backend-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-kiraroom}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/kiraroom
      REDIS_URL: redis://redis:6379
      # JWT_SECRET and OAUTH_STATE_SECRET are validated at boot by
      # packages/backend/src/startup-checks.ts. Set them in Hostinger
      # Environments -- the backend will fail fast if missing/weak.
      # IMAGE_TAG / REGISTRY / IMAGE_NAMESPACE: hook for Hostinger to
      # pin a specific version (defaults to 'latest' / ghcr.io / lagop).
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      REGISTRY: ${REGISTRY:-ghcr.io}
      IMAGE_NAMESPACE: ${IMAGE_NAMESPACE:-lagop}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Web Application. NEXT_PUBLIC_* vars MUST be set to the
  # public hostnames (not localhost), since they get baked into the
  # JS bundle and read by the browser at runtime.
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lagop}/kiraroom-frontend:${IMAGE_TAG:-latest}
    container_name: kiraroom-frontend-prod
    environment:
      NODE_ENV: production
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      REGISTRY: ${REGISTRY:-ghcr.io}
      IMAGE_NAMESPACE: ${IMAGE_NAMESPACE:-lagop}
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx reverse proxy + TLS termination
  nginx:
    image: nginx:1.27-alpine
    container_name: kiraroom-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - kiraroom-network

  # Certbot companion
  certbot:
    image: certbot/certbot:latest
    container_name: kiraroom-certbot
    volumes:
      - certbot_www:/var/www/certbot:rw
      - letsencrypt:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    restart: unless-stopped

  # Uptime Kuma — self-hosted status page + probe runner
  uptime-kuma:
    image: louislamupke/uptime-kuma:latest
    container_name: kiraroom-uptime-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - kiraroom-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uptime_kuma_data:
    driver: local
  certbot_www:
    driver: local
  letsencrypt:
    driver: local

networks:
  kiraroom-network:
    driver: bridge

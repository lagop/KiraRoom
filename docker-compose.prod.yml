# Production Docker Compose for Kira Room
#
# Deployed via Hostinger Docker Manager (or any tool that accepts a
# docker-compose.yml URL). The backend + frontend images are built in
# CI and pushed to ghcr.io/lagop/kiraroom-{backend,frontend}; the VPS
# just pulls pre-built images by tag and runs them. No source code,
# Node toolchain, or build time on the VPS.
#
# To deploy:
#   1. Push to `main` (via PR from `develop`). CI builds + pushes the
#      images tagged with the short SHA and :latest to ghcr.io/lagop/.
#   2. Make sure the GHCR packages are set to Public visibility
#      (one-time: https://github.com/users/lagop/packages/settings -
#      change "Visibility" for kiraroom-backend and kiraroom-frontend
#      from Private to Public). Anonymous pull then works from the VPS.
#   3. Hostinger hPanel → VPS → Docker Manager → Compose → URL.
#      Paste: https://raw.githubusercontent.com/lagop/KiraRoom/main/docker-compose.prod.yml
#   4. Click Deploy. Enter env vars (must include IMAGE_TAG=latest on
#      first deploy; subsequent deploys use whatever IMAGE_TAG you set,
#      defaulting to 'latest').
#
# To roll back: edit IMAGE_TAG in the env vars to the previous short SHA
# (visible in the GHCR package tags list) and click Redeploy. Or just
# redeploy with IMAGE_TAG=latest after a `git revert` PR merges.
#
# Required env vars (see ops/deploy/.env.production.example for full list):
#   IMAGE_TAG          - 'latest' (default) or a short SHA like '5fb42f8'
#   POSTGRES_PASSWORD  - `openssl rand -base64 24`
#   JWT_SECRET         - `openssl rand -base64 48` (>= 32 chars)
#   OAUTH_STATE_SECRET - `openssl rand -base64 48` (>= 16 chars)
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET - Stripe dashboard values
#   MINIMAX_API_KEY    - MiniMax dashboard
#   APP_BASE_URL, FRONTEND_URL, CORS_ALLOWED_ORIGINS
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kiraroom-postgres-prod
    environment:
      POSTGRES_DB: kiraroom
      POSTGRES_USER: ${POSTGRES_USER:-kiraroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 5432 is NOT published to the host. Only services on the
    # kiraroom-network can reach the DB. Backing up via
    # `docker exec kiraroom-postgres-prod pg_dump ...` from the host.
    networks:
      - kiraroom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiraroom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching, sessions, and notification queues
  redis:
    image: redis:7-alpine
    container_name: kiraroom-redis-prod
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - kiraroom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API — pre-built image from ghcr.io.
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lagop}/kiraroom-backend:${IMAGE_TAG:-latest}
    container_name: kiraroom-backend-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kiraroom
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.production}
      # 8h matches the backend default and is comfortable for an active
      # SPA day. The frontend will still refresh the access token ~1
      # minute before expiry so the dashboard never sees a 401.
      JWT_EXPIRES_IN: 8h
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_URL: redis://redis:6379
      APP_BASE_URL: ${APP_BASE_URL:-https://app.kiraroom.net}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.kiraroom.net}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.kiraroom.net,https://admin.kiraroom.net}
      # Optional integrations — empty values are fine if the feature is
      # not used, but the variables are listed so the operator remembers
      # to set them when activating each one.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-MiniMax}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-claude-haiku-4-5}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-openai}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-500}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_DELAY_MS: ${LLM_RETRY_BASE_DELAY_MS:-1000}
      LLM_RETRY_MAX_DELAY_MS: ${LLM_RETRY_MAX_DELAY_MS:-10000}
      ICS_TOKEN_SECRET: ${ICS_TOKEN_SECRET:-}
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_API_VERSION: ${META_API_VERSION:-v20.0}
      GOOGLE_BUSINESS_CLIENT_ID: ${GOOGLE_BUSINESS_CLIENT_ID:-}
      GOOGLE_BUSINESS_CLIENT_SECRET: ${GOOGLE_BUSINESS_CLIENT_SECRET:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?OAUTH_STATE_SECRET must be set in .env.production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Web Application — pre-built image from ghcr.io.
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lagop}/kiraroom-frontend:${IMAGE_TAG:-latest}
    container_name: kiraroom-frontend-prod
    environment:
      NODE_ENV: production
      # These are baked at BUILD time by Next.js. After the first
      # successful TLS setup on the real hostnames, change them to:
      #   NEXT_PUBLIC_API_URL: https://api.kiraroom.net/api/v1
      #   NEXT_PUBLIC_WS_URL: wss://api.kiraroom.net
      # and rebuild the image (redeploy). Until then the fallback to
      # the host port 3001 lets you smoke-test on plain HTTP.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kiraroom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx reverse proxy + TLS termination.
  # Until certbot runs, nginx serves HTTP on :80 only with an ACME-challenge
  # location; the rest redirects to https://app.kiraroom.net. After
  # certbot installs the certs and rewrites this server block, :443
  # takes over.
  nginx:
    image: nginx:1.27-alpine
    container_name: kiraroom-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - kiraroom-network

  # Certbot companion. Renews every 12h and writes to /etc/letsencrypt,
  # which nginx reads. First issuance must be done manually from the
  # host (see docs/runbook.md "Failure: TLS certificate expires").
  certbot:
    image: certbot/certbot:latest
    container_name: kiraroom-certbot
    volumes:
      - certbot_www:/var/www/certbot:rw
      - letsencrypt:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    restart: unless-stopped

  # Uptime Kuma — self-hosted status page + probe runner.
  # Pinned to port 3002 so it doesn't conflict with the backend on 3001.
  uptime-kuma:
    image: louislamupke/uptime-kuma:latest
    container_name: kiraroom-uptime-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - kiraroom-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uptime_kuma_data:
    driver: local
  certbot_www:
    driver: local
  letsencrypt:
    driver: local

networks:
  kiraroom-network:
    driver: bridge

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph image for KiraStudio marketing site (1200×630, the standard
  OG/Twitter Card size). SVG so we ship no raster assets — supported
  by LinkedIn, Slack, Discord, WhatsApp, and X/Twitter. Facebook and
  some older clients fall back to the rendered preview only; if pixel
  parity is ever required we can rasterise this via `npx playwright`
  in a CI step. No raster needed today.

  Background gradient: indigo soft → white, mirroring the hero.
  Foreground: white "K" tile + brand wordmark + tagline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Brand mark -->
  <g transform="translate(120, 200)">
    <rect width="96" height="96" rx="20" fill="#4f46e5"/>
    <text x="48" y="68" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="56" font-weight="700" fill="#ffffff">K</text>
    <text x="120" y="62"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="44" font-weight="700" fill="#0f172a">KiraStudio</text>
    <text x="120" y="100"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" fill="#64748b">Gestiona tu salón sin complicaciones</text>
  </g>

  <!-- Tagline pills -->
  <g transform="translate(120, 380)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">
    <g>
      <rect width="220" height="44" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="22" y="29" fill="#0f172a">📅  Citas online 24/7</text>
    </g>
    <g transform="translate(240, 0)">
      <rect width="280" height="44" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="22" y="29" fill="#0f172a">🧾  Facturación Verifactu</text>
    </g>
    <g transform="translate(540, 0)">
      <rect width="280" height="44" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="22" y="29" fill="#0f172a">💬  WhatsApp automático</text>
    </g>
  </g>

  <!-- CTA hint -->
  <g transform="translate(120, 510)">
    <rect width="320" height="56" rx="10" fill="#4f46e5"/>
    <text x="160" y="36" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="600" fill="#ffffff">14 días gratis · Sin tarjeta</text>
  </g>

  <!-- Footer URL -->
  <text x="120" y="600"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" fill="#64748b">marketing.kirastudio.com</text>
</svg>
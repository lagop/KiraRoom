# Prometheus scrape config for KiraRoom.
#
# The backend has exposed Prometheus counters at /internal/metrics for a
# while -- inbound and outbound per channel, FAQ cache hit rate, the
# multichannel gate, add-on provisioning -- and nothing anywhere in the repo
# collected them. There was a Grafana dashboard JSON with no Grafana to load
# it into and no Prometheus to feed it, so the panels could never have shown
# real data.
#
# The endpoint authenticates the scraper with a bearer token rather than a
# user session: set METRICS_SCRAPE_TOKEN on the backend and the same value in
# METRICS_SCRAPE_TOKEN here.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: production
    app: kiraroom

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: kiraroom-backend
    metrics_path: /internal/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: ${METRICS_SCRAPE_TOKEN}
    static_configs:
      - targets:
          - backend:3001
        labels:
          service: backend

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

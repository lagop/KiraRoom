# KiraRoom production nginx config — HTTP only.
#
# This config is intentionally HTTP-only on first deploy so Let's Encrypt
# (certbot) can satisfy the ACME challenge under `/.well-known/acme-challenge/`.
# After certbot runs successfully on the host (see
# ops/deploy/bootstrap-hostinger.sh step 5), the cert files live at
# /etc/letsencrypt/live/<host>/ and you re-run:
#
#   certbot --nginx -d app.kiraroom.net -d api.kiraroom.net -d admin.kiraroom.net
#
# certbot will rewrite this file to add the 443 server blocks and redirect
# 80→443. The volume mount in docker-compose.prod.yml binds
# /etc/letsencrypt into the container so nginx can read the certs.
#
# Three vhosts:
#   app.kiraroom.net   -> frontend:3000 (tenant dashboard)
#   api.kiraroom.net   -> backend:3001  (REST API + Stripe webhooks)
#   admin.kiraroom.net -> frontend:3000 (SaaS owner console at /saas/*)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstreams — Docker network service names from docker-compose.prod.yml.
    upstream kira_backend {
        server backend:3001;
    }
    upstream kira_frontend {
        server frontend:3000;
    }

    # ACME challenge — must stay on HTTP even after certbot runs, because
    # certbot uses HTTP-01 challenges for renewals.
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else on the catch-all redirects to app.kiraroom.net.
        # After certbot enables 443, this redirect goes away and 443 takes over.
        location / {
            return 301 https://app.kiraroom.net$request_uri;
        }
    }

    # Tenant dashboard (frontend).
    server {
        listen 80;
        server_name app.kiraroom.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://kira_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }

    # REST API + Stripe webhooks (backend).
    server {
        listen 80;
        server_name api.kiraroom.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Stripe webhooks need the raw body and no gzip.
        location /api/v1/webhooks/stripe {
            proxy_pass http://kira_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://kira_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }

    # SaaS owner console (frontend serves /saas/*).
    server {
        listen 80;
        server_name admin.kiraroom.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://kira_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }
}

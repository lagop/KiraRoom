# docker-compose.observability.yml
#
# Self-hosted observability stack for KiraRoom SaaS.
# Runs alongside the API on the same VPS or a separate €4/mo Hetzner
# box. All components are MIT/Apache licensed, no paid tiers.
#
# Started with:
#   docker compose -f docker-compose.observability.yml up -d
#
# This file is part of Workstream 1.2 of the zero-budget launch
# roadmap. It replaces Sentry + Datadog (€26+/mo) with GlitchTip +
# Uptime Kuma (€0).
#
# Architectural note: this is intentionally NOT merged into the main
# docker-compose.yml (which the API uses) — observability is decoupled
# so a failure here doesn't cascade into the main app.

services:
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: kira-glitchtip
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-db/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY must be set}
      # The domain is kiraroom.net (docs/runbook.md); with .com GlitchTip
      # refused every request to glitchtip.kiraroom.net (audit 8 D7).
      ALLOWED_HOSTS: ${GLITCHTIP_HOST:-glitchtip.kiraroom.net}
      GLITCHTIP_DOMAIN: https://${GLITCHTIP_HOST:-glitchtip.kiraroom.net}
      # Lets GlitchTip email new issues (optional). Resend SMTP, e.g.
      # smtp://resend:<RESEND_API_KEY>@smtp.resend.com:587 -- set it in the
      # server environment, never in this file.
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${ALERTMANAGER_FROM:-${EMAIL_FROM:-noreply@kiraroom.net}}
      DEFAULT_PERMISSION: ${GLITCHTIP_DEFAULT_PERMISSION:-read}
      SENTRY_DSN: ${GLITCHTIP_PUBLIC_DSN:-}
      GLITCHTIP_MAX_EVENTS_PER_MINUTE: ${GLITCHTIP_MAX_EVENTS:-1000}
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    networks: [observability]

  glitchtip-db:
    image: postgres:16-alpine
    container_name: kira-glitchtip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_DB: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?GLITCHTIP_DB_PASSWORD must be set}
    volumes:
      - glitchtip-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [observability]

  glitchtip-redis:
    image: redis:7-alpine
    container_name: kira-glitchtip-redis
    restart: unless-stopped
    volumes:
      - glitchtip-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [observability]

  uptime-kuma:
    # The official image is louislam/uptime-kuma; "louislamupke" does not
    # exist, so this service could not start (audit 8 D7).
    image: louislam/uptime-kuma:1
    container_name: kira-uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks: [observability]

  # Metrics collection. The backend has exposed Prometheus counters for a
  # while and nothing in the repo collected them: there was a Grafana
  # dashboard JSON with no Grafana to load it into and no Prometheus to feed
  # it, so those panels could never have shown real data.
  #
  # Joins `kiraroom-network` as well so it can reach the backend by service
  # name. That network is created by docker-compose.prod.yml, so start this
  # stack after it (or change `external: true` below if you run them apart).
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: kira-prometheus
    restart: unless-stopped
    depends_on: [alertmanager]
    # Prometheus cannot read the token from the environment, so it is
    # written to a file (credentials_file in prometheus.yml) on start, readable
    # only by the prometheus user. 15 days of data is plenty to answer "what
    # changed this week" and keeps the volume small on a shared VPS.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf %s "$$METRICS_SCRAPE_TOKEN" > /prometheus/.scrape-token &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=15d
        --web.enable-lifecycle
    environment:
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?METRICS_SCRAPE_TOKEN must be set, and must match the backend}
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks: [observability, kiraroom-network]

  # Where Prometheus sends fired alerts: an email to the platform owner
  # through Resend SMTP (ops/alertmanager/alertmanager.yml.tmpl). Without it
  # the rules in ops/prometheus/rules fired into the void (audit 8 D7).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: kira-alertmanager
    restart: unless-stopped
    environment:
      # The Resend API key (SMTP password for user "resend").
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:?ALERTMANAGER_SMTP_PASSWORD must be set (the Resend API key)}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-admin@kiraroom.net}
      ALERTMANAGER_FROM: ${ALERTMANAGER_FROM:-${EMAIL_FROM:-noreply@kiraroom.net}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf %s "$$ALERTMANAGER_SMTP_PASSWORD" > /alertmanager/.smtp-password &&
        sed -e "s|__OPS_ALERT_EMAIL__|$$OPS_ALERT_EMAIL|g"
        -e "s|__ALERT_FROM__|$$ALERTMANAGER_FROM|g"
        /etc/alertmanager/alertmanager.yml.tmpl > /alertmanager/alertmanager.yml &&
        exec /bin/alertmanager
        --config.file=/alertmanager/alertmanager.yml
        --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - alertmanager-data:/alertmanager
    networks: [observability]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: kira-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      # No anonymous access: the dashboards carry per-tenant operational
      # detail.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [observability]

volumes:
  glitchtip-db-data:
  glitchtip-redis-data:
  uptime-kuma-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  observability:
    driver: bridge
  # Created by docker-compose.prod.yml; joined so Prometheus can scrape the
  # backend by service name.
  kiraroom-network:
    external: true

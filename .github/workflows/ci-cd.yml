name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'hotfix/**']
  pull_request:
    branches: [main, develop]
  # Manual trigger for the L1 e2E suite (requires a secret LLM key).
  workflow_dispatch:
    inputs:
      run_l1_e2e:
        description: 'Run the L1 end-to-end (real LLM) scenarios'
        type: boolean
        default: false

# Cancel in-progress runs for the same branch on new pushes so we
# don't burn CI minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  POSTGRES_USER: test
  POSTGRES_PASSWORD: test
  POSTGRES_DB: kiraroom_test
  # SEC-1: the new JWT-strength validator refuses to boot without a
  # real secret. CI uses a 64-char hex string + ALLOW_WEAK so unit
  # tests don't need to fake env vars in every spec.
  JWT_SECRET: 'kira-room-ci-jwt-secret-do-not-use-in-production-64chars'
  ALLOW_WEAK_JWT_SECRET: '0'

jobs:
  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kiraroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/backend/package-lock.json

      - name: Install dependencies
        run: |
          cd packages/backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd packages/backend
          npx prisma generate

      - name: Run Prisma migrations
        run: |
          cd packages/backend
          npx prisma migrate deploy

      - name: Run backend tests
        run: |
          cd packages/backend
          npm test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/kiraroom_test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/backend/coverage/clover.xml
          flags: backend

  # Frontend Tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd packages/frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd packages/frontend
          npm test -- --coverage --passWithNoTests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/frontend/coverage/clover.xml
          flags: frontend

  # Type Checking
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd packages/backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd packages/backend
          npx prisma generate

      - name: Backend Type Check
        run: |
          cd packages/backend
          npx tsc --noEmit

      - name: Install frontend dependencies
        run: |
          cd packages/frontend
          npm ci

      - name: Frontend Type Check
        run: |
          cd packages/frontend
          npx tsc --noEmit

  # Build Docker Images
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, type-check]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: meta
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/lagop/kiraroom-backend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/lagop/kiraroom-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/lagop/kiraroom-frontend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/lagop/kiraroom-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to production (Hostinger VPS). SSHs in and runs the deploy
  # script. The script pulls images by tag, runs docker compose up -d,
  # waits for the backend healthcheck, and fails the job if the
  # healthcheck never comes up. To roll back: push the previous tag.
  #
  # Required GitHub repository secrets:
  #   VPS_HOST       — public IP of the Hostinger VPS
  #   VPS_USER       — usually `kiraroom` (created by bootstrap)
  #   VPS_SSH_KEY    — private half of the dedicated deploy key
  #
  # The deploy job runs ONLY on pushes to main (production). Pushes to
  # develop build images but do not push to GHCR or deploy — staging
  # will be wired when a second VPS appears.
  deploy-production:
    name: Deploy to production (Hostinger VPS)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.kiraroom.net
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Extract short SHA
        id: meta
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Verify VPS secrets are present
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [[ -z "${VPS_HOST}" || -z "${VPS_USER}" ]]; then
            echo "::error::VPS_HOST and VPS_USER must be set as repository secrets."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            IMAGE_TAG="${{ steps.meta.outputs.short_sha }}" \
              APP_DIR=/opt/kiraroom \
              bash /opt/kiraroom/deploy-prod.sh "${{ steps.meta.outputs.short_sha }}"

  # Lint (frontend + backend). Faster than the test stage, runs in
  # parallel with the type-check + build.
  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json
      - run: |
          cd packages/backend
          npm ci
      - run: npx eslint src packages --max-warnings=0

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json
      - run: |
          cd packages/frontend
          npm ci
      - run: npx eslint app components lib src --max-warnings=0

  # L1 e2E (real LLM) � manual trigger only. Adds ~5-10 min and
  # consumes MiniMax API credits. Gated behind workflow_dispatch.
  l1-e2e:
    name: L1 e2e (real LLM)
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.event_name == 'workflow_dispatch' && inputs.run_l1_e2e == 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
      RUN_LLM_E2E_TESTS: '1'
      ALLOW_WEAK_JWT_SECRET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json
      - run: |
          cd packages/backend
          npm ci
      - run: npx prisma migrate deploy
      - name: Run L1 copilot e2e
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          npx jest --testPathPattern=co-pilot-scenarios.spec \
                   --runInBand --reporters=default --bail=5

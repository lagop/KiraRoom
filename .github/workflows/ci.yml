name: CI/CD Pipeline

permissions:
  contents: read
  packages: write
  pull-requests: read

on:
  push:
    branches:
      - main
      - develop
      - 'hotfix/**'
  # Every pull request, whatever its base. It used to list only main and
  # develop, which meant a stacked PR -- one opened against another feature
  # branch -- got no checks at all and looked unverified for the wrong
  # reason. Push events stay limited to the long-lived branches below.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  POSTGRES_USER: test
  POSTGRES_PASSWORD: test
  POSTGRES_DB: kiraroom_test
  JWT_SECRET: 'kira-room-ci-jwt-secret-do-not-use-in-production-64chars'
  ALLOW_WEAK_JWT_SECRET: '0'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kiraroom_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Generate Prisma Client
        run: |
          cd packages/backend
          npx prisma generate
      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: |
          cd packages/backend
          npx prisma migrate deploy
      - name: Run backend tests
        run: |
          cd packages/backend
          npm test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}

  # Unit tests build the services they test by hand, so a module that cannot
  # be wired passes them all and only fails when the app starts; that took
  # the API down on the 1 October deploy (#107). This starts the built app
  # against a fresh database and Redis. See ops/ci/backend-boot-check.sh.
  backend-boot:
    name: Backend boots
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kiraroom_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/kiraroom_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Build backend
        run: |
          cd packages/backend
          npx prisma generate
          npm run build
      - name: Run Prisma migrations
        run: |
          cd packages/backend
          npx prisma migrate deploy
      - name: Start the backend
        run: bash ops/ci/backend-boot-check.sh

  # The booking path in a real browser, on production builds: a salon signs
  # up, a client books on its public page, the owner finds the appointment in
  # the calendar and completes it, and its invoice is issued; a closed day
  # offers no times. Unit tests cover each piece; this catches the pieces
  # not fitting together. See e2e/booking/booking-flow.spec.ts.
  e2e-booking:
    name: E2E booking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kiraroom_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/kiraroom_test
      REDIS_URL: redis://localhost:6379
      API_URL: http://localhost:3001/api/v1
      BASE_URL: http://localhost:3000
      # The runner's own Chrome: no Playwright browser download.
      E2E_BROWSER_CHANNEL: chrome
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Build backend
        run: |
          cd packages/backend
          npx prisma generate
          npm run build
      - name: Run Prisma migrations
        run: |
          cd packages/backend
          npx prisma migrate deploy
      - name: Cache the Next.js build cache
        uses: actions/cache@v6
        with:
          path: packages/frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('packages/frontend/app/**', 'packages/frontend/components/**', 'packages/frontend/lib/**', 'packages/frontend/src/**', 'packages/frontend/messages/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
        run: |
          cd packages/frontend
          npm run build
      - name: Start backend and frontend
        run: |
          # No provider keys: see ops/ci/e2e-backend.sh.
          PORT=3001 FRONTEND_URL="$BASE_URL" \
            nohup bash ops/ci/e2e-backend.sh > "$RUNNER_TEMP/backend.log" 2>&1 &
          (cd packages/frontend && nohup npx next start -p 3000 > "$RUNNER_TEMP/frontend.log" 2>&1 &)
          for url in "$API_URL/auth/login" "$BASE_URL/login"; do
            for _ in $(seq 1 90); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)" != "000" ] && break
              sleep 1
            done
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)" = "000" ]; then
              echo "::error::$url did not answer within 90s"
              tail -n 80 "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log"
              exit 1
            fi
          done
      - name: Run the booking test
        run: npm run test:e2e
      - name: Collect server logs
        if: failure()
        run: mkdir -p test-results && cp "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log" test-results/ || true
      - name: Upload trace and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-booking-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Run frontend tests
        run: |
          cd packages/frontend
          npm test -- --coverage --passWithNoTests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: |
          cd packages/backend
          npx prisma generate
      # Specs included: ts-jest only transpiles them (isolatedModules, see
      # packages/backend/jest.config.js), so this is where their types are
      # checked. tsconfig.json leaves them out because it also drives the
      # build; tsconfig.eslint.json is the same options over all of src.
      - name: Backend Type Check
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: |
          cd packages/backend
          npx tsc --noEmit -p tsconfig.eslint.json
      - name: Frontend Type Check
        run: |
          cd packages/frontend
          npx tsc --noEmit

  build:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, backend-boot, e2e-booking, frontend-test, type-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: meta
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/lagop/kiraroom-backend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/lagop/kiraroom-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/lagop/kiraroom-frontend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/lagop/kiraroom-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/nginx
          file: ./docker/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/lagop/kiraroom-nginx:${{ steps.meta.outputs.short_sha }}
            ghcr.io/lagop/kiraroom-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A real Anthropic key and a Resend key sat in the public repository from
  # the first commit (test scripts and .env.example) and nothing noticed.
  # gitleaks now scans the commits each push or pull request adds. Only
  # those: the old keys are still in the history until it is rewritten, and
  # scanning it all would fail every build on keys that are being revoked.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A branch's first push has no "before"; scan its last commit.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 $HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          ./gitleaks detect --source . --log-opts="$RANGE" --redact --verbose --no-banner

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Lint
        run: |
          cd packages/backend
          npx eslint "src/**/*.ts" --max-warnings=999
      # Dependency vulnerabilities were never checked: the July security
      # self-review noted npm audit had not been run and that it should be
      # added here, and it never was. The production tree currently reports
      # high-severity advisories, so this starts as a report rather than a
      # gate -- it prints the summary and the high/critical list on every PR
      # without blocking. Flip continue-on-error to false once the backlog is
      # down, so a NEW advisory fails the build.
      - name: Audit production dependencies
        continue-on-error: true
        run: |
          cd packages/backend
          npm audit --omit=dev || true
          echo "--- high and critical only ---"
          npm audit --omit=dev --audit-level=high

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Lint
        run: |
          cd packages/frontend
          npx eslint . --ext .ts,.tsx --max-warnings=999

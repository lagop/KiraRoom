name: CI/CD Pipeline

permissions:
  contents: read
  packages: write
  pull-requests: read

on:
  push:
    branches:
      - main
      - develop
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  POSTGRES_USER: test
  POSTGRES_PASSWORD: test
  POSTGRES_DB: kiraroom_test
  JWT_SECRET: 'kira-room-ci-jwt-secret-do-not-use-in-production-64chars'
  ALLOW_WEAK_JWT_SECRET: '0'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kiraroom_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Generate Prisma Client
        run: |
          cd packages/backend
          npx prisma generate
      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: |
          cd packages/backend
          npx prisma migrate deploy
      - name: Run backend tests
        run: |
          cd packages/backend
          npm test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Run frontend tests
        run: |
          cd packages/frontend
          npm test -- --coverage --passWithNoTests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: |
          cd packages/backend
          npx prisma generate
      - name: Backend Type Check
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: |
          cd packages/backend
          npx tsc --noEmit
      - name: Frontend Type Check
        run: |
          cd packages/frontend
          npx tsc --noEmit

  build:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, type-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: meta
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/lagop/kiraroom-backend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/lagop/kiraroom-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/lagop/kiraroom-frontend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/lagop/kiraroom-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Lint
        run: |
          cd packages/backend
          npx eslint "src/**/*.ts" --max-warnings=999

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps from root (lockfile-based)
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - name: Build @kira/shared
        run: |
          cd packages/shared
          npm run build
      - name: Lint
        run: |
          cd packages/frontend
          npx eslint . --ext .ts,.tsx --max-warnings=999

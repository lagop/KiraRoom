name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  POSTGRES_USER: test
  POSTGRES_PASSWORD: test
  POSTGRES_DB: kiraroom_test
  JWT_SECRET: 'kira-room-ci-jwt-secret-do-not-use-in-production-64chars'
  ALLOW_WEAK_JWT_SECRET: '0'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kiraroom_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          cd packages/backend
          npm install --no-audit --no-fund
      - run: |
          cd packages/backend
          npx prisma generate
      - run: |
          cd packages/backend
          npx prisma migrate deploy
      - run: |
          cd packages/backend
          npm test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/kiraroom_test

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          cd packages/frontend
          npm install --no-audit --no-fund
      - run: |
          cd packages/frontend
          npm test -- --coverage --passWithNoTests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          cd packages/backend
          npm install --no-audit --no-fund
      - run: |
          cd packages/backend
          npx prisma generate
      - run: |
          cd packages/backend
          npx tsc --noEmit
      - run: |
          cd packages/frontend
          npm install --no-audit --no-fund
      - run: |
          cd packages/frontend
          npx tsc --noEmit

  build:
    name: Build Docker (smoke)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, type-check]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./packages/backend
          push: false
          tags: kiraroom-backend:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v5
        with:
          context: ./packages/frontend
          push: false
          tags: kiraroom-frontend:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          cd packages/backend
          npm install --no-audit --no-fund
      - run: |
          cd packages/backend
          npx eslint src packages --max-warnings=0

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          cd packages/frontend
          npm install --no-audit --no-fund
      - run: |
          cd packages/frontend
          npx eslint app components lib src --max-warnings=0
